
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="calculator" content="arithmetic operations">
    <title>Calculator</title>
    <link rel="icon" href="image/Calculator.jpg">
    <link rel="stylesheet" href="mini.css">
    <script defer src="mini.js"></script>
</head>
<body>
    
    <div class="container">
        <div class="calculator"> 
            <input id="display" type="text" readonly placeholder="0">
            
            <button id="clearBtn" class="red">AC</button>
            <button id="deleteBtn" class="red">DEL</button>
            <button class="button">%</button>
            <button class="button operator">/</button>
            <button class="button">7</button>
            <button class="button">8</button>
            <button class="button">9</button>
            <button class="button operator">*</button>
            <button class="button">4</button>
            <button class="button">5</button>
            <button class="button">6</button>
            <button class="button operator">-</button>
            <button class="button">1</button>
            <button class="button">2</button>
            <button class="button">3</button>
            <button class="button operator">+</button>
            <button class="button zero">0</button>
            <button class="button">.</button>
            <button id="calculateBtn" class="operator">=</button>
        
        </div>
    </div>
</body>
</html>
